name: Compilar APK

# Se dispara a mano desde la pestaña "Actions" de GitHub (botón "Run workflow").
# Los runners de GitHub ya traen el SDK de Android instalado, así que no hace
# falta instalar nada extra, solo el JDK que pide Gradle.
on:
  workflow_dispatch:
    inputs:
      modelo_url:
        description: >
          URL de descarga directa del .gguf (el asset de un Release de este repo,
          ver README). Si se deja vacío, compila sin el modelo: sirve para
          comprobar que el código compila, pero el APK resultante no va a
          funcionar hasta que se le agregue el modelo.
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Descargar el modelo cuantizado (si se dio una URL)
        if: ${{ inputs.modelo_url != '' }}
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail -o app/src/main/assets/models/maize_llama32_1b_Q4_K_M.gguf "${{ inputs.modelo_url }}"
          ls -lh app/src/main/assets/models/

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: maize-ia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
