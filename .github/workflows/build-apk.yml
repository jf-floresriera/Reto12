name: Compilar APK

# Se dispara a mano desde la pestaña "Actions" de GitHub (botón "Run workflow").
# Los runners de GitHub ya traen el SDK de Android instalado, así que no hace
# falta instalar nada extra, solo el JDK que pide Gradle.
on:
  workflow_dispatch:
    inputs:
      modelo_url:
        description: >
          URL de descarga directa del .gguf (el asset de un Release, ver README).
          Si se deja vacío, compila sin el modelo: sirve para comprobar que el
          código compila, pero el APK resultante no va a funcionar hasta que se
          le agregue el modelo.
        required: false
        type: string
      publicar_release:
        description: "Publicar el APK como Release de GitHub (para distribuirlo)"
        required: false
        type: boolean
        default: false
      version:
        description: "Etiqueta del Release, p. ej. v0.2.0 (solo si se publica)"
        required: false
        type: string
        default: "v0.2.0"

permissions:
  contents: write # necesario solo para crear el Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # La configuración de Firebase (app/google-services.json) puede estar subida al
      # repo o guardada como secret GOOGLE_SERVICES_JSON (Settings > Secrets and
      # variables > Actions). Si existe el secret, tiene prioridad.
      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::Falta app/google-services.json. Súbelo al repo o crea el secret GOOGLE_SERVICES_JSON (ver README, sección Configuración de Firebase)."
            exit 1
          fi

      - name: Descargar el modelo cuantizado (si se dio una URL)
        if: ${{ inputs.modelo_url != '' }}
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail -o app/src/main/assets/models/maize_llama32_1b_Q4_K_M.gguf "${{ inputs.modelo_url }}"
          ls -lh app/src/main/assets/models/

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: agro-ia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar Release con el APK
        if: ${{ inputs.publicar_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "agro-ia-${{ inputs.version }}.apk"
          gh release create "${{ inputs.version }}" "agro-ia-${{ inputs.version }}.apk" \
            --title "Agro IA ${{ inputs.version }}" \
            --notes "APK de Agro IA con inicio de sesión con GitHub. Instalar en Android 7.0 o superior (6 GB de RAM recomendados)."
